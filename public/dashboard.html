<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pravaah | Municipal Drainage Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #EDF1F5;
    --surface: #FFFFFF;
    --ink: #12263A;
    --ink-2: #4A5E72;
    --ink-3: #7A8CA0;
    --line: #DCE3EA;
    --line-2: #EBEFF3;
    --water: #0B6E99;
    --water-soft: #E3F1F7;
    --crit: #C8372D;      --crit-fill: #D9382C;   --crit-soft: #FBEAE8;
    --watch: #8F5B00;     --watch-fill: #E39A0B;  --watch-soft: #FDF1DC;
    --safe: #177A52;      --safe-fill: #1E9E68;   --safe-soft: #E4F4EC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    line-height: 1.45;
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }

  /* ---------- Top bar ---------- */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px; background: var(--water);
    display: grid; place-items: center;
  }
  .brand h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .brand p { font-size: 12.5px; color: var(--ink-3); }
  .top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .updated { font-size: 12.5px; color: var(--ink-3); }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    background: var(--safe-soft); color: var(--safe);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--safe-fill); }
  .pill.error { background: var(--crit-soft); color: var(--crit); }
  .pill.error .dot { background: var(--crit-fill); }
  .pill.sample { background: var(--water-soft); color: var(--water); }
  .pill.sample .dot { background: var(--water); }

  /* ---------- Layout ---------- */
  main { max-width: 1280px; margin: 0 auto; padding: 22px 28px 40px; }

  .alert {
    display: none; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--crit-soft); border: 1px solid #F2C9C5; border-left: 4px solid var(--crit-fill);
    border-radius: 10px; padding: 12px 18px; margin-bottom: 18px;
  }
  .alert.show { display: flex; }
  .alert strong { color: var(--crit); font-weight: 600; }
  .alert span { color: var(--ink-2); font-size: 14px; margin-left: 6px; }

  .summary {
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 20px; overflow: hidden;
  }
  .sum-cell { padding: 16px 22px; border-right: 1px solid var(--line-2); }
  .sum-cell:last-child { border-right: none; }
  .sum-num { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .sum-label { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .c-crit { color: var(--crit); } .c-watch { color: var(--watch); } .c-safe { color: var(--safe); }

  .grid { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
  .panel-head h2 { font-size: 15px; font-weight: 600; }
  .panel-head p { font-size: 13px; color: var(--ink-3); margin-top: 2px; }

  /* ---------- Priority queue ---------- */
  .queue-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid var(--line-2); padding: 14px 18px 14px 22px; position: relative;
  }
  .queue-item:last-child { border-bottom: none; }
  .queue-item::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--safe-fill);
  }
  .queue-item.critical::before { background: var(--crit-fill); }
  .queue-item.watch::before { background: var(--watch-fill); }
  .queue-item:hover { background: #F7FAFC; }
  .queue-item.selected { background: #EFF6FA; }
  .qi-top { display: flex; justify-content: space-between; align-items: baseline; }
  .qi-id { font-weight: 600; font-size: 15px; }
  .qi-score { font-weight: 600; font-size: 15px; }
  .qi-sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .bar { flex: 1; height: 6px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--safe-fill); }
  .critical .bar > i { background: var(--crit-fill); }
  .watch .bar > i { background: var(--watch-fill); }
  .bar-label { font-size: 12.5px; color: var(--ink-3); min-width: 62px; text-align: right; }
  .tag-off {
    font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--line-2);
    padding: 2px 8px; border-radius: 999px; margin-left: 8px;
  }

  .empty { padding: 36px 24px; text-align: center; color: var(--ink-2); font-size: 14px; }
  .empty p { margin-bottom: 14px; max-width: 280px; margin-left: auto; margin-right: auto; }

  /* ---------- Buttons ---------- */
  .btn {
    border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--water); background: var(--water); color: #fff;
  }
  .btn:hover { background: #095A7E; }
  .btn.ghost { background: #fff; color: var(--water); }
  .btn.ghost:hover { background: var(--water-soft); }
  .btn.danger { background: var(--crit-fill); border-color: var(--crit-fill); }
  .btn.danger:hover { background: var(--crit); }
  .btn:disabled { background: var(--line-2); border-color: var(--line-2); color: var(--ink-3); cursor: not-allowed; }

  /* ---------- Detail ---------- */
  .detail { padding: 24px; }
  .d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .d-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .d-title h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
  .badge { font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; }
  .badge.critical { background: var(--crit-soft); color: var(--crit); }
  .badge.watch { background: var(--watch-soft); color: var(--watch); }
  .badge.safe { background: var(--safe-soft); color: var(--safe); }
  .d-meta { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  .online { display: inline-flex; align-items: center; gap: 6px; }
  .online i { width: 8px; height: 8px; border-radius: 50%; background: var(--safe-fill); display: inline-block; }
  .online.off i { background: var(--ink-3); }

  .action {
    margin: 20px 0; padding: 14px 18px; border-radius: 10px; font-size: 14.5px;
    background: var(--safe-soft); color: #0F5A3B;
  }
  .action.critical { background: var(--crit-soft); color: #8E241C; }
  .action.watch { background: var(--watch-soft); color: #6B4400; }
  .action strong { font-weight: 600; }

  .d-body { display: grid; grid-template-columns: 250px 1fr; gap: 28px; align-items: start; }
  .gauge-wrap { text-align: center; }
  .gauge-wrap svg { width: 100%; max-width: 250px; height: auto; display: block; margin: 0 auto; }
  .gauge-big { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .gauge-cap { font-size: 13px; color: var(--ink-2); }
  #waterG { transition: transform 0.9s cubic-bezier(.2,.7,.2,1); }

  dl.stats > div {
    display: flex; justify-content: space-between; gap: 16px; padding: 12px 0;
    border-bottom: 1px solid var(--line-2); font-size: 14.5px;
  }
  dl.stats > div:first-child { padding-top: 0; }
  dl.stats dt { color: var(--ink-2); }
  dl.stats dd { font-weight: 600; text-align: right; }

  .chart-box { margin-top: 26px; border-top: 1px solid var(--line-2); padding-top: 18px; }
  .chart-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .chart-wrap { position: relative; height: 240px; }

  @media (max-width: 960px) {
    .grid { grid-template-columns: 1fr; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .sum-cell { border-bottom: 1px solid var(--line-2); }
    .d-body { grid-template-columns: 1fr; }
    main { padding: 18px 16px 32px; }
    .topbar { padding: 12px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { #waterG { transition: none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.2 6 10.5a6 6 0 0 1-12 0C6 9.2 12 3 12 3z"/></svg>
    </div>
    <div>
      <h1>Pravaah drainage control</h1>
      <p>Municipal monitoring for stormwater drains</p>
    </div>
  </div>
  <div class="top-right">
    <span class="updated" id="updated"></span>
    <span class="pill" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Connecting</span></span>
  </div>
</header>

<main>
  <div class="alert" id="alert">
    <div><strong id="alertTitle"></strong><span id="alertText"></span></div>
    <button class="btn danger" id="alertBtn">Open the highest-risk drain</button>
  </div>

  <section class="summary" aria-label="Summary">
    <div class="sum-cell"><div class="sum-num" id="sumTotal">0</div><div class="sum-label">Drains monitored</div></div>
    <div class="sum-cell"><div class="sum-num c-crit" id="sumCrit">0</div><div class="sum-label">Need a crew now</div></div>
    <div class="sum-cell"><div class="sum-num c-watch" id="sumWatch">0</div><div class="sum-label">Filling up</div></div>
    <div class="sum-cell"><div class="sum-num c-safe" id="sumSafe">0</div><div class="sum-label">Clear</div></div>
    <div class="sum-cell"><div class="sum-num" id="sumTop">-</div><div class="sum-label" id="sumTopLabel">Highest risk</div></div>
  </section>

  <div class="grid">
    <section class="panel" aria-label="Cleaning priority">
      <div class="panel-head">
        <h2>Cleaning priority</h2>
        <p>Drains ranked by risk, highest first</p>
      </div>
      <div id="queue"></div>
    </section>

    <section class="panel detail" id="detail" aria-live="polite"></section>
  </div>
</main>

<script>
  // ---------- CONFIG ----------
  // Opened from the Render server: uses that same server automatically.
  // Opened as a local file: falls back to the Render address below.
  const RENDER_URL = "https://pravah-backend-jt0u.onrender.com";
  const BACKEND_URL = location.protocol.startsWith('http') ? location.origin : RENDER_URL;
  const REFRESH_MS = 15000;
  const OFFLINE_AFTER_MIN = 5;   // a drain with no reading for this long shows as offline

  // ---------- STATE ----------
  let nodes = [];
  let selectedId = null;
  let chart = null;
  let sampleMode = false;
  let timer = null;
  let lastPct = null, lastId = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lvl = n => n.risk_level || 'safe';
  const fmt = (v, d = 1) => (v === undefined || v === null || isNaN(v)) ? '-' : Number(v).toFixed(d).replace(/\.0+$/, '');
  const capOf = n => n.capacity_cm || (n.percent_full > 0 ? n.water_level_cm / n.percent_full * 100 : 60);
  const pctOf = n => Math.max(0, Math.min(100, Number(n.percent_full) || 0));

  function ago(ts) {
    const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
    if (s < 60) return s + ' sec ago';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    return Math.round(s / 3600) + ' hr ago';
  }
  function isOnline(n) { return n.timestamp && (Date.now() - new Date(n.timestamp).getTime()) / 60000 < OFFLINE_AFTER_MIN; }
  function trend(n) {
    const r = Number(n.rate_of_rise_cm_per_min) || 0;
    if (r > 0.05) return 'rising ' + fmt(r) + ' cm/min';
    if (r < -0.05) return 'falling ' + fmt(Math.abs(r)) + ' cm/min';
    return 'level steady';
  }
  function eta(n) {
    const r = Number(n.rate_of_rise_cm_per_min) || 0, cap = capOf(n), l = Number(n.water_level_cm) || 0;
    if (r <= 0.05 || l >= cap) return null;
    const m = (cap - l) / r;
    if (m > 180) return 'more than 3 hours';
    return 'about ' + Math.max(1, Math.round(m)) + ' min';
  }
  function actionText(n) {
    const e = eta(n), p = fmt(pctOf(n), 0);
    if (lvl(n) === 'critical') return `<strong>Send a cleaning crew now.</strong> The drain is ${p}% full${e ? ' and could overflow in ' + e : ''}.`;
    if (lvl(n) === 'watch') return `<strong>Schedule an inspection today.</strong> The drain is ${p}% full and ${trend(n)}.`;
    return `<strong>No action needed.</strong> The drain is ${p}% full and ${trend(n)}.`;
  }

  // ---------- RENDER: summary + alert ----------
  function renderSummary() {
    const c = { critical: 0, watch: 0, safe: 0 };
    nodes.forEach(n => c[lvl(n)]++);
    $('sumTotal').textContent = nodes.length;
    $('sumCrit').textContent = c.critical;
    $('sumWatch').textContent = c.watch;
    $('sumSafe').textContent = c.safe;

    const top = sorted()[0];
    $('sumTop').textContent = top ? top.node_id : '-';
    $('sumTopLabel').textContent = top ? 'Highest risk, score ' + (top.risk_score ?? 0) : 'Highest risk';

    const al = $('alert');
    if (c.critical > 0) {
      $('alertTitle').textContent = c.critical === 1 ? '1 drain needs a crew now.' : c.critical + ' drains need a crew now.';
      $('alertText').textContent = 'Water is close to overflowing.';
      al.classList.add('show');
    } else al.classList.remove('show');
  }

  function sorted() {
    return [...nodes].sort((a, b) => (b.risk_score || 0) - (a.risk_score || 0));
  }

  // ---------- RENDER: queue ----------
  function renderQueue() {
    const box = $('queue');
    if (!nodes.length) {
      box.innerHTML = `<div class="empty"><p>No readings yet. Drains appear here as soon as a sensor reports.</p>
        <button class="btn ghost" onclick="startSample()">Preview with sample data</button></div>`;
      return;
    }
    box.innerHTML = sorted().map(n => `
      <button class="queue-item ${lvl(n)} ${n.node_id === selectedId ? 'selected' : ''}" data-id="${esc(n.node_id)}">
        <div class="qi-top">
          <span class="qi-id">${esc(n.node_id)}${isOnline(n) ? '' : '<span class="tag-off">Offline</span>'}</span>
          <span class="qi-score c-${lvl(n) === 'critical' ? 'crit' : lvl(n)}">${n.risk_score ?? 0}</span>
        </div>
        <div class="qi-sub">${fmt(n.water_level_cm)} cm deep, ${trend(n)}</div>
        <div class="bar-row"><div class="bar"><i style="width:${pctOf(n)}%"></i></div><span class="bar-label">${fmt(pctOf(n), 0)}% full</span></div>
      </button>`).join('');
    box.querySelectorAll('.queue-item').forEach(b => b.onclick = () => selectNode(b.dataset.id));
  }

  // ---------- RENDER: detail ----------
  function gaugeSVG(startPct) {
    const y40 = 270 - 240 * 0.4, y70 = 270 - 240 * 0.7;
    return `
    <svg viewBox="0 0 230 290" role="img" aria-label="Water level inside the drain chamber">
      <defs><clipPath id="chamberClip"><rect x="24" y="30" width="100" height="240" rx="6"/></clipPath></defs>
      <rect x="62" y="4" width="24" height="16" rx="4" fill="#12263A"/>
      <text x="94" y="16" font-size="11" fill="#7A8CA0">Sensor</text>
      <rect x="24" y="30" width="100" height="240" rx="6" fill="#F7FAFC"/>
      <g clip-path="url(#chamberClip)">
        <g id="waterG" style="transform: translateY(${(1 - startPct / 100) * 240}px)">
          <rect x="24" y="30" width="100" height="240" fill="#8CC4DB" opacity="0.8"/>
          <rect x="24" y="30" width="100" height="4" fill="#0B6E99"/>
        </g>
      </g>
      <rect x="24" y="30" width="100" height="240" rx="6" fill="none" stroke="#4A5E72" stroke-width="2"/>
      <line x1="18" x2="130" y1="${y40}" y2="${y40}" stroke="#E39A0B" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="136" y="${y40 + 4}" font-size="11.5" fill="#8F5B00">40% watch</text>
      <line x1="18" x2="130" y1="${y70}" y2="${y70}" stroke="#D9382C" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="136" y="${y70 + 4}" font-size="11.5" fill="#C8372D">70% critical</text>
    </svg>`;
  }

  function renderDetail() {
    const box = $('detail');
    const n = nodes.find(x => x.node_id === selectedId);
    if (!n) {
      box.innerHTML = `<div class="empty"><p>Select a drain from the list to see its water level, history and recommended action.</p></div>`;
      return;
    }
    const pct = pctOf(n);
    const startPct = (lastId === n.node_id && lastPct !== null) ? lastPct : 0;
    const e = eta(n);

    box.innerHTML = `
      <div class="d-head">
        <div>
          <div class="d-title"><h2>${esc(n.node_id)}</h2><span class="badge ${lvl(n)}">${{critical:'Critical',watch:'Watch',safe:'Clear'}[lvl(n)]}</span></div>
          <div class="d-meta"><span class="online ${isOnline(n) ? '' : 'off'}"><i></i>${isOnline(n) ? 'Sensor online' : 'Sensor offline'}</span>
            &nbsp;&nbsp;Last reading ${n.timestamp ? ago(n.timestamp) : '-'}&nbsp;&nbsp;Location ${fmt(n.lat, 4)}, ${fmt(n.lng, 4)}</div>
        </div>
        <button class="btn" id="cleanBtn" ${lvl(n) === 'safe' ? 'disabled' : ''}>Mark as cleaned</button>
      </div>

      <div class="action ${lvl(n)}">${actionText(n)}</div>

      <div class="d-body">
        <div class="gauge-wrap">
          ${gaugeSVG(startPct)}
          <div class="gauge-big">${fmt(pct, 0)}%</div>
          <div class="gauge-cap">of drain depth is filled</div>
        </div>
        <dl class="stats">
          <div><dt>Water level</dt><dd>${fmt(n.water_level_cm)} cm</dd></div>
          <div><dt>Drain depth</dt><dd>${fmt(capOf(n))} cm</dd></div>
          <div><dt>Rate of rise</dt><dd>${fmt(n.rate_of_rise_cm_per_min, 2)} cm/min</dd></div>
          <div><dt>Risk score</dt><dd>${n.risk_score ?? 0} out of 100</dd></div>
          <div><dt>Estimated time to overflow</dt><dd>${e ?? 'Not rising'}</dd></div>
          <div><dt>Last cleaned</dt><dd>${n.last_cleaned ? ago(n.last_cleaned) : 'Not recorded'}</dd></div>
        </dl>
      </div>

      <div class="chart-box">
        <h3>Water level history</h3>
        <div class="chart-wrap"><canvas id="historyChart"></canvas></div>
      </div>`;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      const g = $('waterG');
      if (g) g.style.transform = `translateY(${(1 - pct / 100) * 240}px)`;
    }));
    lastId = n.node_id; lastPct = pct;

    $('cleanBtn').onclick = () => markCleaned(n.node_id);
    loadHistory(n);
  }

  async function loadHistory(n) {
    let hist = [];
    if (sampleMode) hist = n._history || [];
    else {
      try {
        const r = await fetch(`${BACKEND_URL}/api/nodes/${encodeURIComponent(n.node_id)}/history`);
        hist = r.ok ? await r.json() : [];
      } catch (err) { hist = []; }
    }
    hist = hist.slice(-60);
    const ctx = $('historyChart');
    if (!ctx) return;
    if (typeof Chart === 'undefined') {
      ctx.parentElement.innerHTML = '<div class="empty">The history chart could not load. Check your internet connection and refresh the page.</div>';
      return;
    }
    if (chart) chart.destroy();
    const cap = capOf(n);
    const labels = hist.map(h => new Date(h.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    chart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [
        { label: 'Water level (cm)', data: hist.map(h => h.water_level_cm), borderColor: '#0B6E99', backgroundColor: 'rgba(11,110,153,0.12)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
        { label: 'Watch line (40%)', data: hist.map(() => cap * 0.4), borderColor: '#E39A0B', borderDash: [5, 4], borderWidth: 1.3, pointRadius: 0, fill: false },
        { label: 'Critical line (70%)', data: hist.map(() => cap * 0.7), borderColor: '#D9382C', borderDash: [5, 4], borderWidth: 1.3, pointRadius: 0, fill: false }
      ]},
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, color: '#4A5E72', font: { family: 'IBM Plex Sans' } } } },
        scales: {
          x: { ticks: { maxTicksLimit: 6, color: '#7A8CA0' }, grid: { display: false } },
          y: { min: 0, suggestedMax: cap, ticks: { color: '#7A8CA0' }, grid: { color: '#EBEFF3' }, title: { display: true, text: 'cm', color: '#7A8CA0' } }
        }
      }
    });
  }

  function renderAll() {
    if (nodes.length && !nodes.find(n => n.node_id === selectedId)) selectedId = sorted()[0].node_id;
    if (!nodes.length) selectedId = null;
    renderSummary(); renderQueue(); renderDetail();
  }

  function selectNode(id) { selectedId = id; lastId = null; renderQueue(); renderDetail(); }

  // ---------- ACTIONS ----------
  async function markCleaned(id) {
    if (sampleMode) {
      const n = nodes.find(x => x.node_id === id);
      n.risk_score = 0; n.risk_level = 'safe'; n.percent_full = 8; n.water_level_cm = capOf(n) * 0.08;
      n.rate_of_rise_cm_per_min = 0; n.last_cleaned = new Date().toISOString();
      renderAll(); return;
    }
    try {
      await fetch(`${BACKEND_URL}/api/nodes/${encodeURIComponent(id)}/clean`, { method: 'POST' });
      await fetchNodes();
    } catch (err) { setStatus('error', 'Could not reach the server'); }
  }

  function setStatus(kind, text) {
    const p = $('status');
    p.className = 'pill' + (kind === 'error' ? ' error' : kind === 'sample' ? ' sample' : '');
    $('statusText').textContent = text;
  }

  async function fetchNodes() {
    if (sampleMode) return;
    try {
      const r = await fetch(`${BACKEND_URL}/api/nodes`);
      if (!r.ok) throw new Error('bad response');
      nodes = await r.json();
      setStatus('live', 'Live, ' + nodes.length + (nodes.length === 1 ? ' drain' : ' drains'));
      $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
      renderAll();
    } catch (err) {
      setStatus('error', 'Cannot reach server, retrying');
    }
  }

  // ---------- SAMPLE DATA (for previewing the layout) ----------
  function startSample() {
    sampleMode = true;
    const now = Date.now();
    const defs = [
      { id: 'PRV-01', lat: 13.0827, lng: 80.2707, cap: 60, lvl: 49, rate: 2.6, ageMin: 0 },
      { id: 'PRV-02', lat: 13.0674, lng: 80.2376, cap: 60, lvl: 30, rate: 0.8, ageMin: 0 },
      { id: 'PRV-03', lat: 13.0569, lng: 80.2425, cap: 70, lvl: 12, rate: 0, ageMin: 0 },
      { id: 'PRV-04', lat: 13.0732, lng: 80.2609, cap: 80, lvl: 52, rate: 0.2, ageMin: 22 }
    ];
    nodes = defs.map(d => {
      const pct = d.lvl / d.cap * 100;
      let score = pct + (d.rate > 2 ? 20 : d.rate > 0.5 ? 10 : 0);
      score = Math.min(Math.round(score), 100);
      const hist = [];
      for (let i = 40; i >= 0; i--) {
        const f = 1 - i / 40;
        const l = Math.max(2, d.lvl * (0.35 + 0.65 * f) + (Math.sin(i) * 0.8));
        hist.push({ timestamp: new Date(now - (i + d.ageMin) * 60000).toISOString(), water_level_cm: +l.toFixed(1) });
      }
      return {
        node_id: d.id, lat: d.lat, lng: d.lng, water_level_cm: d.lvl, capacity_cm: d.cap,
        rate_of_rise_cm_per_min: d.rate, percent_full: +pct.toFixed(1), risk_score: score,
        risk_level: score > 70 ? 'critical' : score > 40 ? 'watch' : 'safe',
        timestamp: new Date(now - d.ageMin * 60000).toISOString(), _history: hist
      };
    });
    clearInterval(timer);
    setStatus('sample', 'Sample data');
    $('updated').textContent = 'Preview only, not live sensor data';
    renderAll();
  }

  $('alertBtn').onclick = () => { const t = sorted()[0]; if (t) selectNode(t.node_id); };

  renderAll();
  fetchNodes();
  timer = setInterval(fetchNodes, REFRESH_MS);
</script>
</body>
</html>
