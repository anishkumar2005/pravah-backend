<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Municipal dashboard | Pravaah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="/app.css">
<style>
  main { max-width: 1280px; margin: 0 auto; padding: 22px 28px 40px; }
  .top-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .updated { font-size: 12.5px; color: var(--ink-3); }
  .who { font-size: 13.5px; color: var(--ink-2); padding-left: 12px; border-left: 1px solid var(--line); }
  .who b { color: var(--ink); font-weight: 600; }

  .alert { display: none; align-items: center; justify-content: space-between; gap: 16px; background: var(--crit-soft); border: 1px solid #F2C9C5; border-left: 4px solid var(--crit-fill); border-radius: 10px; padding: 12px 18px; margin-bottom: 18px; }
  .alert.show { display: flex; }
  .alert strong { color: var(--crit); font-weight: 600; }
  .alert span { color: var(--ink-2); font-size: 14px; margin-left: 6px; }

  .summary { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
  .sum-cell { padding: 16px 22px; border-right: 1px solid var(--line-2); }
  .sum-cell:last-child { border-right: none; }
  .sum-num { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .sum-label { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .c-crit { color: var(--crit); } .c-watch { color: var(--watch); } .c-safe { color: var(--safe); } .c-work { color: var(--water); }

  .grid { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
  .panel-head h2 { font-size: 15px; font-weight: 600; }
  .panel-head p { font-size: 13px; color: var(--ink-3); margin-top: 2px; }

  .queue-item { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line-2); padding: 14px 18px 14px 22px; position: relative; }
  .queue-item:last-child { border-bottom: none; }
  .queue-item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--safe-fill); }
  .queue-item.critical::before { background: var(--crit-fill); }
  .queue-item.watch::before { background: var(--watch-fill); }
  .queue-item:hover { background: #F7FAFC; }
  .queue-item.selected { background: #EFF6FA; }
  .qi-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .qi-id { font-weight: 600; font-size: 15px; }
  .qi-score { font-weight: 600; font-size: 15px; }
  .qi-sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .bar { flex: 1; height: 6px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--safe-fill); }
  .critical .bar > i { background: var(--crit-fill); } .watch .bar > i { background: var(--watch-fill); }
  .bar-label { font-size: 12.5px; color: var(--ink-3); min-width: 62px; text-align: right; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; background: var(--line-2); color: var(--ink-2); }
  .chip.work { background: var(--water-soft); color: var(--water); }
  .chip.wait { background: var(--crit-soft); color: var(--crit); }

  .empty { padding: 36px 24px; text-align: center; color: var(--ink-2); font-size: 14px; }
  .empty p { margin: 0 auto 14px; max-width: 290px; }

  .detail { padding: 24px; }
  .d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .d-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .d-title h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
  .d-meta { font-size: 13px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .online { display: inline-flex; align-items: center; gap: 6px; }
  .online i { width: 8px; height: 8px; border-radius: 50%; background: var(--safe-fill); display: inline-block; }
  .online.off i { background: var(--ink-3); }

  .action { margin: 20px 0 6px; padding: 14px 18px; border-radius: 10px; font-size: 14.5px; background: var(--safe-soft); color: #0F5A3B; }
  .action.critical { background: var(--crit-soft); color: #8E241C; }
  .action.watch { background: var(--watch-soft); color: #6B4400; }
  .action.work { background: var(--water-soft); color: #08506F; }
  .action strong { font-weight: 600; }

  /* the clean-up stages */
  .stepper { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); margin: 22px 0 8px; }
  .stepper li { position: relative; padding-top: 30px; padding-right: 10px; }
  .stepper li::before { content: ""; position: absolute; top: 11px; left: 0; right: 0; height: 3px; background: var(--line); }
  .stepper li.done::before, .stepper li.now::before { background: var(--water); }
  .stepper li .node { position: absolute; top: 3px; left: 0; width: 19px; height: 19px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; z-index: 1; }
  .stepper li.done .node { background: var(--water); border-color: var(--water); }
  .stepper li.now .node { border-color: var(--water); box-shadow: 0 0 0 4px var(--water-soft); }
  .stepper .lab { display: block; font-size: 14px; font-weight: 600; color: var(--ink-3); }
  .stepper li.done .lab, .stepper li.now .lab { color: var(--ink); }
  .stepper .when { font-size: 12.5px; color: var(--ink-3); }
  .step-actions { display: flex; align-items: center; gap: 14px; margin: 14px 0 4px; flex-wrap: wrap; }
  .step-actions .note { font-size: 13px; color: var(--ink-3); }

  .d-body { display: grid; grid-template-columns: 250px 1fr; gap: 28px; align-items: start; margin-top: 26px; }
  .gauge-wrap { text-align: center; }
  .gauge-wrap svg { width: 100%; max-width: 250px; height: auto; display: block; margin: 0 auto; }
  .gauge-big { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .gauge-cap { font-size: 13px; color: var(--ink-2); }
  #waterG { transition: transform 0.9s cubic-bezier(.2,.7,.2,1); }
  dl.stats > div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line-2); font-size: 14.5px; }
  dl.stats > div:first-child { padding-top: 0; }
  dl.stats dt { color: var(--ink-2); } dl.stats dd { font-weight: 600; text-align: right; }

  .log { margin-top: 26px; border-top: 1px solid var(--line-2); padding-top: 18px; }
  .log h3, .chart-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .log ul { list-style: none; }
  .log li { display: flex; gap: 14px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid var(--line-2); }
  .log li:last-child { border-bottom: none; }
  .log time { color: var(--ink-3); min-width: 74px; }
  .log .by { color: var(--ink-3); }
  .chart-box { margin-top: 26px; border-top: 1px solid var(--line-2); padding-top: 18px; }
  .chart-wrap { position: relative; height: 240px; }

  @media (max-width: 960px) {
    .grid { grid-template-columns: 1fr; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .sum-cell { border-bottom: 1px solid var(--line-2); }
    .d-body { grid-template-columns: 1fr; }
    .stepper { grid-template-columns: 1fr 1fr; row-gap: 14px; }
    main { padding: 18px 16px 32px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.2 6 10.5a6 6 0 0 1-12 0C6 9.2 12 3 12 3z"/></svg></span>
    <span><span class="name">Pravaah drainage control</span><span class="tag">Municipal monitoring for stormwater drains</span></span>
  </a>
  <div class="top-right">
    <span class="updated" id="updated"></span>
    <span class="pill" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Connecting</span></span>
    <nav class="nav" aria-label="Main"><a href="/">Home</a><a href="/map">Live map</a></nav>
    <span class="who">Signed in as <b id="who"></b></span>
    <button class="btn ghost" id="logout" type="button">Sign out</button>
  </div>
</header>

<main>
  <div class="alert" id="alert">
    <div><strong id="alertTitle"></strong><span id="alertText"></span></div>
    <button class="btn danger" id="alertBtn" type="button">Open the highest-risk drain</button>
  </div>

  <section class="summary" aria-label="Summary">
    <div class="sum-cell"><div class="sum-num" id="sumTotal">0</div><div class="sum-label">Drains monitored</div></div>
    <div class="sum-cell"><div class="sum-num c-crit" id="sumCrit">0</div><div class="sum-label">Overflow risk now</div></div>
    <div class="sum-cell"><div class="sum-num c-work" id="sumWork">0</div><div class="sum-label">Crews on the job</div></div>
    <div class="sum-cell"><div class="sum-num c-safe" id="sumDone">0</div><div class="sum-label">Recently cleaned</div></div>
    <div class="sum-cell"><div class="sum-num" id="sumTop">-</div><div class="sum-label" id="sumTopLabel">Highest risk</div></div>
  </section>

  <div class="grid">
    <section class="panel" aria-label="Cleaning priority">
      <div class="panel-head"><h2>Cleaning priority</h2><p>Drains ranked by risk, highest first</p></div>
      <div id="queue"></div>
    </section>
    <section class="panel detail" id="detail" aria-live="polite"></section>
  </div>
</main>

<script>
  const REFRESH_MS = 15000;
  const OFFLINE_AFTER_MIN = 5;

  let nodes = [], selectedId = null, chart = null, sampleMode = false, timer = null, lastPct = null, lastId = null, busy = false;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lvl = n => n.risk_level || 'safe';
  const ws = n => n.work_status || 'monitoring';
  const fmt = (v, d = 1) => (v === undefined || v === null || isNaN(v)) ? '-' : Number(v).toFixed(d).replace(/\.0+$/, '');
  const capOf = n => n.capacity_cm || (n.percent_full > 0 ? n.water_level_cm / n.percent_full * 100 : 60);
  const pctOf = n => Math.max(0, Math.min(100, Number(n.percent_full) || 0));
  const clock = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const STEPS = [
    { key: 'alert', label: 'Alert raised' },
    { key: 'crew_assigned', label: 'Crew assigned' },
    { key: 'in_progress', label: 'Work in progress' },
    { key: 'cleaned', label: 'Cleaned' }
  ];
  const STEP_INDEX = { alert: 0, crew_assigned: 1, in_progress: 2, cleaned: 3 };
  const NEXT = {
    monitoring: { to: 'crew_assigned', label: 'Assign a crew' },
    alert: { to: 'crew_assigned', label: 'Assign a crew' },
    crew_assigned: { to: 'in_progress', label: 'Start work' },
    in_progress: { to: 'cleaned', label: 'Mark as cleaned' }
  };
  const LOG_TEXT = { alert: 'Alert raised', crew_assigned: 'Crew assigned', in_progress: 'Work started', cleaned: 'Marked as cleaned', monitoring: 'Back to normal monitoring' };

  function ago(ts) {
    const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
    if (s < 60) return s + ' sec ago';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    return Math.round(s / 3600) + ' hr ago';
  }
  const isOnline = n => n.timestamp && (Date.now() - new Date(n.timestamp).getTime()) / 60000 < OFFLINE_AFTER_MIN;
  function trend(n) {
    const r = Number(n.rate_of_rise_cm_per_min) || 0;
    if (r > 0.05) return 'rising ' + fmt(r) + ' cm/min';
    if (r < -0.05) return 'falling ' + fmt(Math.abs(r)) + ' cm/min';
    return 'level steady';
  }
  function eta(n) {
    const r = Number(n.rate_of_rise_cm_per_min) || 0, cap = capOf(n), l = Number(n.water_level_cm) || 0;
    if (r <= 0.05 || l >= cap) return null;
    const m = (cap - l) / r;
    return m > 180 ? 'more than 3 hours' : 'about ' + Math.max(1, Math.round(m)) + ' min';
  }
  function sorted() { return [...nodes].sort((a, b) => (b.risk_score || 0) - (a.risk_score || 0)); }
  const needsCrew = n => lvl(n) === 'critical' && (ws(n) === 'alert' || ws(n) === 'monitoring');

  function actionBox(n) {
    const p = fmt(pctOf(n), 0), e = eta(n);
    switch (ws(n)) {
      case 'crew_assigned': return ['work', '<strong>A crew has been assigned.</strong> Mark the work as started when they reach the drain.'];
      case 'in_progress': return ['work', '<strong>Work is in progress.</strong> Mark it cleaned once the drain is clear.'];
      case 'cleaned':
        return lvl(n) === 'safe'
          ? ['safe', '<strong>Cleaned.</strong> The drain is back to normal.']
          : ['watch', `<strong>Marked as cleaned, but the sensor still reads ${p}% full.</strong> Check the drain again.`];
    }
    if (lvl(n) === 'critical') return ['critical', `<strong>Send a cleaning crew now.</strong> The drain is ${p}% full${e ? ' and could overflow in ' + e : ''}.`];
    if (lvl(n) === 'watch') return ['watch', `<strong>Schedule an inspection today.</strong> The drain is ${p}% full and ${trend(n)}.`];
    return ['safe', `<strong>No action needed.</strong> The drain is ${p}% full and ${trend(n)}.`];
  }

  // ---------- summary + alert ----------
  function renderSummary() {
    $('sumTotal').textContent = nodes.length;
    $('sumCrit').textContent = nodes.filter(n => lvl(n) === 'critical').length;
    $('sumWork').textContent = nodes.filter(n => ws(n) === 'crew_assigned' || ws(n) === 'in_progress').length;
    $('sumDone').textContent = nodes.filter(n => ws(n) === 'cleaned').length;
    const top = sorted()[0];
    $('sumTop').textContent = top ? top.node_id : '-';
    $('sumTopLabel').textContent = top ? 'Highest risk, score ' + (top.risk_score ?? 0) : 'Highest risk';

    const waiting = nodes.filter(needsCrew).length;
    $('alert').classList.toggle('show', waiting > 0);
    if (waiting) {
      $('alertTitle').textContent = waiting === 1 ? '1 drain needs a crew now.' : waiting + ' drains need a crew now.';
      $('alertText').textContent = 'Water is close to overflowing and no crew is assigned yet.';
    }
  }

  // ---------- queue ----------
  function workTag(n) {
    if (needsCrew(n)) return '<span class="chip wait">Needs crew</span>';
    const t = { crew_assigned: 'Crew assigned', in_progress: 'In progress', cleaned: 'Cleaned' }[ws(n)];
    return t ? `<span class="chip work">${t}</span>` : '';
  }
  function renderQueue() {
    const box = $('queue');
    if (!nodes.length) {
      box.innerHTML = `<div class="empty"><p>No readings yet. Drains appear here as soon as a sensor reports.</p><button class="btn ghost" id="sampleBtn" type="button">Preview with sample data</button></div>`;
      $('sampleBtn').onclick = startSample;
      return;
    }
    box.innerHTML = sorted().map(n => `
      <button class="queue-item ${lvl(n)} ${n.node_id === selectedId ? 'selected' : ''}" data-id="${esc(n.node_id)}">
        <div class="qi-top"><span class="qi-id">${esc(n.node_id)}${isOnline(n) ? '' : '<span class="chip">Offline</span>'}${workTag(n)}</span>
          <span class="qi-score c-${lvl(n) === 'critical' ? 'crit' : lvl(n)}">${n.risk_score ?? 0}</span></div>
        <div class="qi-sub">${fmt(n.water_level_cm)} cm deep, ${trend(n)}</div>
        <div class="bar-row"><div class="bar"><i style="width:${pctOf(n)}%"></i></div><span class="bar-label">${fmt(pctOf(n), 0)}% full</span></div>
      </button>`).join('');
    box.querySelectorAll('.queue-item').forEach(b => b.onclick = () => selectNode(b.dataset.id));
  }

  // ---------- detail ----------
  function gaugeSVG(startPct, watchPct, critPct) {
    const y40 = 270 - 240 * watchPct / 100, y70 = 270 - 240 * critPct / 100;
    return `<svg viewBox="0 0 230 290" role="img" aria-label="Water level inside the drain chamber">
      <defs><clipPath id="chamberClip"><rect x="24" y="30" width="100" height="240" rx="6"/></clipPath></defs>
      <rect x="62" y="4" width="24" height="16" rx="4" fill="#12263A"/><text x="94" y="16" font-size="11" fill="#6B7E92">Sensor</text>
      <rect x="24" y="30" width="100" height="240" rx="6" fill="#F7FAFC"/>
      <g clip-path="url(#chamberClip)"><g id="waterG" style="transform: translateY(${(1 - startPct / 100) * 240}px)">
        <rect x="24" y="30" width="100" height="240" fill="#8CC4DB" opacity="0.8"/><rect x="24" y="30" width="100" height="4" fill="#0B6E99"/></g></g>
      <rect x="24" y="30" width="100" height="240" rx="6" fill="none" stroke="#4A5E72" stroke-width="2"/>
      <line x1="18" x2="130" y1="${y40}" y2="${y40}" stroke="#E39A0B" stroke-width="1.5" stroke-dasharray="5 4"/><text x="136" y="${y40 + 4}" font-size="11.5" fill="#8F5B00">${watchPct}% watch</text>
      <line x1="18" x2="130" y1="${y70}" y2="${y70}" stroke="#D9382C" stroke-width="1.5" stroke-dasharray="5 4"/><text x="136" y="${y70 + 4}" font-size="11.5" fill="#C8372D">${critPct}% critical</text>
    </svg>`;
  }

  function stepperHTML(n) {
    const w = ws(n), log = n.work_log || [];
    const at = k => { const e = [...log].reverse().find(x => x.status === k); return e ? clock(e.at) : ''; };
    const idx = STEP_INDEX[w];   // undefined when just monitoring
    return `<ol class="stepper" aria-label="Clean-up progress">` + STEPS.map((s, i) => {
      let cls = '';
      if (idx !== undefined) cls = i < idx || (w === 'cleaned') ? 'done' : (i === idx ? 'now' : '');
      return `<li class="${cls}"><span class="node">${cls === 'done' ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>' : ''}</span>
        <span class="lab">${s.label}</span><span class="when">${at(s.key) || '&nbsp;'}</span></li>`;
    }).join('') + '</ol>';
  }

  function renderDetail() {
    const box = $('detail');
    const n = nodes.find(x => x.node_id === selectedId);
    if (!n) { box.innerHTML = `<div class="empty"><p>Select a drain from the list to see its details, recommended action and clean-up progress.</p></div>`; return; }
    const pct = pctOf(n), startPct = (lastId === n.node_id && lastPct !== null) ? lastPct : 0;
    const [aCls, aText] = actionBox(n), next = NEXT[ws(n)];
    const canAct = next && !(ws(n) === 'monitoring' && lvl(n) === 'safe');
    const e = eta(n);
    const log = [...(n.work_log || [])].reverse().slice(0, 6);

    box.innerHTML = `
      <div class="d-head"><div>
        <div class="d-title"><h2>${esc(n.node_id)}</h2><span class="badge ${lvl(n)}">${{critical:'Overflow risk',watch:'Filling up',safe:'Clear'}[lvl(n)]}</span></div>
        <div class="d-meta"><span class="online ${isOnline(n) ? '' : 'off'}"><i></i>${isOnline(n) ? 'Sensor online' : 'Sensor offline'}</span>
          <span>Last reading ${n.timestamp ? ago(n.timestamp) : '-'}</span><span>Location ${fmt(n.lat, 4)}, ${fmt(n.lng, 4)}</span></div>
      </div></div>

      <div class="action ${aCls}">${aText}</div>
      ${stepperHTML(n)}
      <div class="step-actions">
        <button class="btn" id="advance" type="button" ${canAct ? '' : 'disabled'}>${next ? next.label : 'Closed'}</button>
        <span class="note">${ws(n) === 'cleaned' ? 'This job is closed.' : (!canAct ? 'Nothing to do while the drain is clear.' : 'Every step is recorded with your name.')}</span>
      </div>

      <div class="d-body">
        <div class="gauge-wrap">${gaugeSVG(startPct, n.watch_pct ?? 40, n.critical_pct ?? 90)}<div class="gauge-big">${fmt(pct, 0)}%</div><div class="gauge-cap">of drain depth is filled</div></div>
        <dl class="stats">
          <div><dt>Water level</dt><dd>${fmt(n.water_level_cm)} cm</dd></div>
          <div><dt>Drain depth</dt><dd>${fmt(capOf(n))} cm</dd></div>
          <div><dt>Rate of rise</dt><dd>${fmt(n.rate_of_rise_cm_per_min, 2)} cm/min</dd></div>
          <div><dt>Risk score</dt><dd>${n.risk_score ?? 0} out of 100</dd></div>
          <div><dt>Estimated time to overflow</dt><dd>${e ?? 'Not rising'}</dd></div>
          <div><dt>Last cleaned</dt><dd>${n.last_cleaned ? ago(n.last_cleaned) : 'Not recorded'}</dd></div>
        </dl>
      </div>

      ${log.length ? `<div class="log"><h3>Activity</h3><ul>${log.map(x => `<li><time>${clock(x.at)}</time><span>${LOG_TEXT[x.status] || esc(x.status)}</span><span class="by">${x.by === 'system' ? 'automatic' : 'by ' + esc(x.by)}</span></li>`).join('')}</ul></div>` : ''}

      <div class="chart-box"><h3>Water level history</h3><div class="chart-wrap"><canvas id="historyChart"></canvas></div></div>`;

    requestAnimationFrame(() => requestAnimationFrame(() => { const g = $('waterG'); if (g) g.style.transform = `translateY(${(1 - pct / 100) * 240}px)`; }));
    lastId = n.node_id; lastPct = pct;
    if ($('advance') && canAct) $('advance').onclick = () => advance(n.node_id, next.to);
    loadHistory(n);
  }

  async function loadHistory(n) {
    let hist = [];
    if (sampleMode) hist = n._history || [];
    else { try { const r = await fetch(`/api/nodes/${encodeURIComponent(n.node_id)}/history`); hist = r.ok ? await r.json() : []; } catch (e) { hist = []; } }
    hist = hist.slice(-60);
    const ctx = $('historyChart');
    if (!ctx) return;
    if (typeof Chart === 'undefined') { ctx.parentElement.innerHTML = '<div class="empty">The history chart could not load. Check your internet connection and refresh the page.</div>'; return; }
    if (chart) chart.destroy();
    const cap = capOf(n), wp = n.watch_pct ?? 40, cp = n.critical_pct ?? 90;
    chart = new Chart(ctx, {
      type: 'line',
      data: { labels: hist.map(h => clock(h.timestamp)), datasets: [
        { label: 'Water level (cm)', data: hist.map(h => h.water_level_cm), borderColor: '#0B6E99', backgroundColor: 'rgba(11,110,153,0.12)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
        { label: 'Watch line (' + wp + '%)', data: hist.map(() => cap * wp / 100), borderColor: '#E39A0B', borderDash: [5, 4], borderWidth: 1.3, pointRadius: 0, fill: false },
        { label: 'Critical line (' + cp + '%)', data: hist.map(() => cap * cp / 100), borderColor: '#D9382C', borderDash: [5, 4], borderWidth: 1.3, pointRadius: 0, fill: false }
      ]},
      options: { animation: false, responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 14, color: '#4A5E72', font: { family: 'IBM Plex Sans' } } } },
        scales: { x: { ticks: { maxTicksLimit: 6, color: '#6B7E92' }, grid: { display: false } },
                  y: { min: 0, suggestedMax: cap, ticks: { color: '#6B7E92' }, grid: { color: '#EBEFF3' }, title: { display: true, text: 'cm', color: '#6B7E92' } } } }
    });
  }

  function renderAll() {
    if (nodes.length && !nodes.find(n => n.node_id === selectedId)) selectedId = sorted()[0].node_id;
    if (!nodes.length) selectedId = null;
    renderSummary(); renderQueue(); renderDetail();
  }
  function selectNode(id) { selectedId = id; lastId = null; renderQueue(); renderDetail(); }

  // ---------- actions ----------
  function setStatus(kind, text) { $('status').className = 'pill' + (kind === 'error' ? ' error' : kind === 'sample' ? ' sample' : ''); $('statusText').textContent = text; }
  function toSignIn() { location.href = '/login?next=/dashboard'; }

  async function advance(id, to) {
    if (busy) return; busy = true;
    $('advance').disabled = true;
    try {
      if (sampleMode) {
        const n = nodes.find(x => x.node_id === id);
        n.work_status = to; n.work_log = n.work_log || [];
        n.work_log.push({ status: to, at: new Date().toISOString(), by: 'you' });
        if (to === 'cleaned') n.last_cleaned = new Date().toISOString();
        renderAll();
      } else {
        const r = await fetch(`/api/nodes/${encodeURIComponent(id)}/status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: to }) });
        if (r.status === 401) return toSignIn();
        if (!r.ok) { const d = await r.json().catch(() => ({})); setStatus('error', d.error || 'Could not update'); }
        await fetchNodes();
      }
    } catch (e) { setStatus('error', 'Could not reach the server'); }
    finally { busy = false; }
  }

  async function fetchNodes() {
    if (sampleMode) return;
    try {
      const r = await fetch('/api/staff/nodes');
      if (r.status === 401) return toSignIn();
      if (!r.ok) throw new Error('bad response');
      nodes = await r.json();
      setStatus('live', 'Live, ' + nodes.length + (nodes.length === 1 ? ' drain' : ' drains'));
      $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
      renderAll();
    } catch (e) { setStatus('error', 'Cannot reach server, retrying'); }
  }

  // ---------- sample data, to preview the layout ----------
  function startSample() {
    sampleMode = true;
    const now = Date.now();
    const defs = [
      { id: 'PRV-01', lat: 13.0334, lng: 80.1795, cap: 60, lvl: 49, rate: 2.6, age: 0, ws: 'alert' },
      { id: 'PRV-02', lat: 13.0412, lng: 80.1701, cap: 60, lvl: 38, rate: 0.9, age: 0, ws: 'crew_assigned' },
      { id: 'PRV-03', lat: 13.0289, lng: 80.1862, cap: 70, lvl: 12, rate: 0, age: 0, ws: 'monitoring' },
      { id: 'PRV-04', lat: 13.0365, lng: 80.1650, cap: 80, lvl: 52, rate: 0.2, age: 22, ws: 'monitoring' }
    ];
    nodes = defs.map(d => {
      const pct = d.lvl / d.cap * 100;
      const score = Math.min(Math.round(pct + (d.rate > 2 ? 20 : d.rate > 0.5 ? 10 : 0)), 100);
      const hist = [];
      for (let i = 40; i >= 0; i--) hist.push({ timestamp: new Date(now - (i + d.age) * 60000).toISOString(), water_level_cm: +Math.max(2, d.lvl * (0.35 + 0.65 * (1 - i / 40)) + Math.sin(i) * 0.8).toFixed(1) });
      const log = d.ws === 'alert' ? [{ status: 'alert', at: new Date(now - 4 * 60000).toISOString(), by: 'system' }]
        : d.ws === 'crew_assigned' ? [{ status: 'alert', at: new Date(now - 12 * 60000).toISOString(), by: 'system' }, { status: 'crew_assigned', at: new Date(now - 6 * 60000).toISOString(), by: 'you' }] : [];
      return { node_id: d.id, lat: d.lat, lng: d.lng, water_level_cm: d.lvl, capacity_cm: d.cap, rate_of_rise_cm_per_min: d.rate, percent_full: +pct.toFixed(1),
        risk_score: score, risk_level: score >= 90 ? 'critical' : score >= 40 ? 'watch' : 'safe', watch_pct: 40, critical_pct: 90, timestamp: new Date(now - d.age * 60000).toISOString(),
        work_status: d.ws, work_log: log, _history: hist };
    });
    clearInterval(timer);
    setStatus('sample', 'Sample data');
    $('updated').textContent = 'Preview only, not live sensor data';
    renderAll();
  }

  $('alertBtn').onclick = () => { const t = sorted().find(needsCrew) || sorted()[0]; if (t) selectNode(t.node_id); };
  $('logout').onclick = async () => { try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {} location.href = '/'; };

  fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(d => { if (d) $('who').textContent = d.user; else toSignIn(); }).catch(() => {});
  renderAll();
  fetchNodes();
  timer = setInterval(fetchNodes, REFRESH_MS);
</script>
</body>
</html>
